<!DOCTYPE html>
<html>
<head>
  <title>Stream Overlay</title>
  <!-- Needed so canvas chat bubbles can use the same retro font as
       viewer.html. OBS's browser source loads Google Fonts fine. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="margin:0; background:transparent;">
<canvas id="overlay" width="1920" height="1080" style="position:absolute; image-rendering:pixelated;"></canvas>
<script src="https://interactive-website-9620.onrender.com/socket.io/socket.io.js"></script>
<!-- Overlay, split into scope-sharing modules loaded IN ORDER (classic scripts,
     one shared global scope). rendering.js starts the draw loop last. -->
<script src="/js/overlay/net.js"></script>
<script src="/js/overlay/duck.js"></script>
<script src="/js/overlay/chat.js"></script>
<script src="/js/overlay/skins.js"></script>
<script src="/js/overlay/effects.js"></script>
<script src="/js/overlay/scene.js"></script>
<script src="/js/overlay/animation.js"></script>
<script src="/js/overlay/rendering.js"></script>
</body>
</html>
