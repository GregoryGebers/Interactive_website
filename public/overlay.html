<!DOCTYPE html>
<html>
<head>
  <title>Stream Overlay</title>
  <!-- Needed so canvas chat bubbles can use the same retro font as
       viewer.html. OBS's browser source loads Google Fonts fine. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body style="margin:0; background:transparent;">
<canvas id="overlay" width="1920" height="1080" style="position:absolute;"></canvas>
<script src="https://interactive-website-9620.onrender.com/socket.io/socket.io.js"></script>
<script>
  //"https://interactive-website-9620.onrender.com/socket.io/socket.io.js"
  const socket = io("https://interactive-website-9620.onrender.com");
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const players = {};

  const now0 = () => performance.now();

  // Canvas fillText silently falls back to the default font until the
  // webfont is actually loaded — force-load it up front so the first chat
  // bubble doesn't render in Times New Roman.
  if (document.fonts && document.fonts.load) {
    document.fonts.load('8px "Press Start 2P"');
  }

  socket.on("init", data => {
    for (const id in players) delete players[id];
    for (const id in data) {
      const p = data[id];
      players[id] = { ...p, renderX: p.x, renderY: p.y, lastUpdateAt: now0() };
    }
  });
  socket.on("new-player", data => {
    players[data.id] = { ...data, renderX: data.x, renderY: data.y, lastUpdateAt: now0() };
  });
  socket.on("player-move", data => {
    const existing = players[data.id];
    if (existing) {
      // Merge into the SAME object so renderX/renderY (the smoothed display
      // position) and the local animation state below survive — this is what
      // lets the interpolation keep easing toward the new target instead of
      // snapping straight to it.
      const previousScore = Number(existing.score);
      const incomingScore = Number(data.score);
      Object.assign(existing, data);
      // Scores only go up during a session. This prevents a bad/stale packet
      // from briefly drawing the high score as 0 on the overlay.
      existing.score = Math.max(
        Number.isFinite(previousScore) ? previousScore : 0,
        Number.isFinite(incomingScore) ? incomingScore : 0
      );
      existing.lastUpdateAt = now0();
    } else {
      players[data.id] = { ...data, renderX: data.x, renderY: data.y, lastUpdateAt: now0() };
    }
  });
  socket.on("remove-player", id => delete players[id]);

  // ---- Chat bubbles ----------------------------------------------------------
  // The server broadcasts already-filtered messages as {id, message}.
  // Attach the message to the matching player and let draw() render it as a
  // pixel speech bubble until it expires.
  const CHAT_DURATION_MS = 6000;

  socket.on('chat', data => {
    if (!data || typeof data.message !== 'string' || !data.message) return;
    const p = players[data.id];
    if (!p) return;
    p.chatMessage = data.message;
    p.chatExpiresAt = now0() + CHAT_DURATION_MS;
  });

  // ---- Bat swings --------------------------------------------------------
  // The server broadcasts 'player-swing' {id, dir} whenever someone presses
  // space in viewer.html. The overlay just plays the same 250ms bottom-to-
  // top swipe animation viewer.html uses, anchored to that player's sprite.
  // (The knockback itself needs no overlay logic — the launched player's
  // own client applies the velocity, and their normal position updates
  // carry the flight here like any other movement.)
  const SWING_DURATION_MS = 250;

  socket.on('player-swing', data => {
    if (!data) return;
    const p = players[data.id];
    if (!p) return;
    p.swingStartAt = now0();
    p.swingDir = Number(data.dir) === -1 ? -1 : 1;
  });

  const CHAT_FONT = '8px "Press Start 2P", monospace';
  const CHAT_LINE_HEIGHT = 12;
  const CHAT_PAD = 6;
  const CHAT_MAX_LINE_CHARS = 18;

  function wrapChatLines(text, maxChars) {
    const lines = [];
    let line = '';
    for (let word of text.split(' ')) {
      // Hard-break words longer than a whole line so they can't blow the
      // bubble out sideways.
      while (word.length > maxChars) {
        if (line) { lines.push(line); line = ''; }
        lines.push(word.slice(0, maxChars));
        word = word.slice(maxChars);
      }
      if (!word) continue;
      if (!line) {
        line = word;
      } else if (line.length + 1 + word.length <= maxChars) {
        line += ' ' + word;
      } else {
        lines.push(line);
        line = word;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Same pixel look as viewer.html: hard-edged box, offset shadow, blocky
  // stepped tail, no rounded corners or blur.
  function drawChatBubble(context, text, cx, bottomY) {
    const lines = wrapChatLines(text, CHAT_MAX_LINE_CHARS);
    context.font = CHAT_FONT;
    let maxW = 0;
    for (const l of lines) maxW = Math.max(maxW, context.measureText(l).width);
    const w = Math.ceil(maxW) + CHAT_PAD * 2;
    const h = lines.length * CHAT_LINE_HEIGHT + CHAT_PAD * 2 - 3;
    const x = Math.round(cx - w / 2);
    const y = Math.round(bottomY - h - 8); // leave room for the tail

    // Offset shadow, then body, then border.
    context.fillStyle = '#16241a';
    context.fillRect(x + 2, y + 2, w, h);
    context.fillStyle = '#f3f7ee';
    context.fillRect(x, y, w, h);
    context.lineWidth = 2;
    context.strokeStyle = '#16241a';
    context.strokeRect(x, y, w, h);

    // Pixel-step tail (two shrinking blocks) pointing at the character.
    context.fillStyle = '#16241a';
    context.fillRect(cx - 5, y + h, 10, 5);
    context.fillRect(cx - 3, y + h + 3, 6, 5);
    context.fillStyle = '#f3f7ee';
    context.fillRect(cx - 3, y + h - 1, 6, 4);
    context.fillRect(cx - 1, y + h + 3, 2, 3);

    context.fillStyle = '#16241a';
    context.textAlign = 'left';
    context.textBaseline = 'top';
    let ty = y + CHAT_PAD;
    for (const l of lines) {
      context.fillText(l, x + CHAT_PAD, ty);
      ty += CHAT_LINE_HEIGHT;
    }
  }

  const idleimg = new Image();
  idleimg.src = '/assets/characters/craftpix-net-879657-free-slime-mobs-pixel-art-top-down-sprite-pack/PNG/Slime1/Idle/Slime1_Idle_body.png';
  
  idleimg.onload = () => requestAnimationFrame(draw);

  const walkimg = new Image();
  walkimg.src = '/assets/characters/craftpix-net-879657-free-slime-mobs-pixel-art-top-down-sprite-pack/PNG/Slime1/Run/Slime1_Run_body.png';
  walkimg.onload = () => requestAnimationFrame(draw);

  // ---- Cosmetic slime skins (mirrors viewer.html) ----
  // Players send their equipped skin id in each move packet; map it to the
  // right sprite sheets so the overlay shows the same look the game does.
  const CHAR_DIR = '/assets/characters/craftpix-net-879657-free-slime-mobs-pixel-art-top-down-sprite-pack/PNG/Slime1';
  const P_MOB = '/assets/slimes/craftpix-net-788364-free-slime-mobs-pixel-art-top-down-sprite-pack/PNG';
  const P_MONSTER = '/assets/slimes/craftpix-net-510319-top-down-pixel-art-slime-monsters-sprite-pack/PNG';
  const P_ENEMY = '/assets/slimes/craftpix-net-743043-pixel-art-slime-enemies-top-down-sprite-pack/PNG';
  const bodySheets = (base, n) => ({
    idle: `${base}/Slime${n}/Parts/Slime${n}_Idle_body.png`,
    run: `${base}/Slime${n}/Parts/Slime${n}_Run_body.png`,
  });
  const SKINS = {
    classic:  { idle: `${CHAR_DIR}/Idle/Slime1_Idle_body.png`, run: `${CHAR_DIR}/Run/Slime1_Run_body.png` },
    mob1: bodySheets(P_MOB, 1), mob2: bodySheets(P_MOB, 2), mob3: bodySheets(P_MOB, 3),
    monster1: bodySheets(P_MONSTER, 1), monster2: bodySheets(P_MONSTER, 2), monster3: bodySheets(P_MONSTER, 3),
    enemy1: bodySheets(P_ENEMY, 1), enemy2: bodySheets(P_ENEMY, 2), enemy3: bodySheets(P_ENEMY, 3),
  };
  const skinSheetCache = { classic: { idle: idleimg, run: walkimg } };
  function skinSheet(id, action) {
    const key = SKINS[id] ? id : 'classic';
    let sheets = skinSheetCache[key];
    if (!sheets) {
      const s = SKINS[key];
      sheets = { idle: new Image(), run: new Image() };
      sheets.idle.src = s.idle; sheets.run.src = s.run;
      sheets.idle.onload = () => requestAnimationFrame(draw);
      sheets.run.onload = () => requestAnimationFrame(draw);
      skinSheetCache[key] = sheets;
    }
    const want = action === 'run' ? sheets.run : sheets.idle;
    if (want.complete && want.naturalWidth) return want;
    const c = skinSheetCache.classic;
    const cf = action === 'run' ? c.run : c.idle;
    return (cf.complete && cf.naturalWidth) ? cf : want;
  }


  const boximg = new Image();
  boximg.src = '/assets/obstacles/box_1.png';
  boximg.onload = () => requestAnimationFrame(draw);

  const coinImg = new Image();
  coinImg.src = '/assets/obstacles/coin.png';
  coinImg.onload = () => {
    requestAnimationFrame(draw);
  }

  const grassImg = new Image();
  grassImg.src = '/assets/obstacles/grass.png';
  grassImg.onload = () => {
    requestAnimationFrame(draw);
  }

  // Bat sprite is drawn VERTICALLY (grip at the bottom) — the swing code
  // rotates it around the grip, so image-up = where the bat points.
  const batImg = new Image();
  batImg.src = '/assets/obstacles/bat.png';


  // ---- Shared game-feel effects ---------------------------------------------
  // These are the SAME world-space visual effects the player clients see.
  // The overlay deliberately has NO camera-shake system, so the stream stays
  // stable even when individual player browsers shake on impacts/landings.
  const fxParticles = [];
  const fxRings = [];
  const fxSprites = [];
  const fxCoinPops = [];

  function loadFrames(paths) {
    return paths.map(src => { const im = new Image(); im.src = src; return im; });
  }
  const EFFECT_DASH = {
    frames: loadFrames(Array.from({length:12}, (_,i)=>`/assets/effects/Horisontal_smoke/Horisontal_smoke${i+1}.png`)),
    w:100, h:100, duration:0.26,
  };
  const EFFECT_DOUBLE_JUMP = {
    frames: loadFrames(Array.from({length:7}, (_,i)=>`/assets/effects/Smoke_ring1/Smoke_ring1_${i+1}.png`)),
    w:64, h:64, duration:0.30,
  };
  const EFFECT_LAND = {
    frames: loadFrames(Array.from({length:11}, (_,i)=>`/assets/effects/Falling_smoke/Falling_smoke${i+6}.png`)),
    w:117, h:48, duration:0.35,
  };
  const EFFECT_INVIS = {
    sheet:(()=>{ const im=new Image(); im.src='/assets/effects/invisibility/9.png'; return im; })(),
    cols:8, w:72, h:72, duration:0.5,
  };
  const HIT_STOP_SEC = 0.065;

  const fxRand = (a,b) => a + Math.random() * (b-a);
  const fxLerp = (a,b,t) => a + (b-a) * Math.max(0, Math.min(1,t));

  function spawnFxSprite(effect, x, y, opts={}) {
    fxSprites.push({ effect, x, y, flipX:!!opts.flipX, flipY:!!opts.flipY,
      elapsed:0, duration:Number(opts.duration)||effect.duration||0.3 });
  }
  function pushFxParticle(p) {
    p.life = Number(p.life)||0.2; p.maxLife = p.life; fxParticles.push(p);
  }
  function spawnImpactParticles(x,y,dir,tier=0,maxTier=3) {
    const count = Math.round(fxLerp(3,6,maxTier>0?tier/maxTier:0));
    for (let i=0;i<count;i++) {
      pushFxParticle({ type:'square', x:x+fxRand(-4,4), y:y+fxRand(-6,6),
        vx:-dir*fxRand(85,155)+fxRand(-24,24), vy:fxRand(-105,45), gravity:210,
        size:fxRand(2.5,5.5), color:i%3===0?'#ffc145':'#f3f7ee', life:fxRand(.18,.3) });
    }
  }
  function spawnRing(x,y,startRadius,endRadius,life,color='#f3f7ee',lineWidth=2) {
    fxRings.push({x,y,startRadius,endRadius,life,maxLife:life,color,lineWidth});
  }
  function spawnCoinFx(x,y) {
    fxCoinPops.push({x,y,elapsed:0,duration:0.12});
    for (let i=0;i<4;i++) pushFxParticle({type:'square',x:x+10,y:y+10,
      vx:fxRand(-70,70),vy:fxRand(-115,-45),gravity:250,size:fxRand(2.5,4.5),color:'#ffc145',life:fxRand(.2,.32)});
    pushFxParticle({type:'spark',x:x+10,y:y+6,vx:0,vy:-18,gravity:0,size:6,color:'#fff7cf',life:.16});
  }

  function handleSharedPlayerFx(data) {
    if (!data) return;
    const x=Number(data.x), y=Number(data.y);
    if (!Number.isFinite(x)||!Number.isFinite(y)) return;
    const p=players[data.id];
    const now=now0();
    const type=String(data.type||'');
    if (type==='dash') {
      const dir=Number(data.dir)===-1?-1:1, cx=x+10, cy=y+10;
      spawnFxSprite(EFFECT_DASH,cx-EFFECT_DASH.w/2-dir*18,cy-EFFECT_DASH.h/2,{flipX:dir>0});
    } else if (type==='jump') {
      if (p) p.jumpStretchStartedAt=now;
    } else if (type==='double-jump') {
      const cx=x+10, feet=y+20;
      spawnFxSprite(EFFECT_DOUBLE_JUMP,cx-EFFECT_DOUBLE_JUMP.w/2,feet-EFFECT_DOUBLE_JUMP.h/2);
      if (p) p.jumpStretchStartedAt=now;
    } else if (type==='land') {
      const cx=x+10, feet=y+20;
      spawnFxSprite(EFFECT_LAND,cx-EFFECT_LAND.w/2,feet-EFFECT_LAND.h,{flipY:false});
      if (p) p.landingSquashStartedAt=now;
    } else if (type==='invisibility') {
      const cx=x+10, cy=y+10;
      spawnFxSprite(EFFECT_INVIS,cx-EFFECT_INVIS.w/2+5,cy-EFFECT_INVIS.h+10);
    }
  }

  socket.on('player-fx', handleSharedPlayerFx);
  socket.on('coin-fx', data => {
    if (!data) return;
    const x=Number(data.x), y=Number(data.y);
    if (Number.isFinite(x)&&Number.isFinite(y)) spawnCoinFx(x,y);
  });
  socket.on('player-hit', data => {
    if (!data) return;
    const target=players[data.targetId];
    if (!target) return;
    const dir=Number(data.dir)===-1?-1:1;
    const maxTier=Math.max(1,Number(data.maxTier)||1);
    const tier=Math.max(0,Math.min(maxTier,Number(data.tier)||0));
    const tx=(target.renderX??target.x)+10, ty=(target.renderY??target.y)+10;
    spawnImpactParticles(tx,ty,dir,tier,maxTier);
    target.hitFlashUntil=now0()+90;
    target.hitStopUntil=now0()+HIT_STOP_SEC*1000;
    if (tier>=maxTier) {
      spawnRing(tx,ty,7,48,.28,'#ffc145',3);
      target.hitSquashUntil=now0()+80;
    }
  });

  function updateSharedFx(dt) {
    const step=Math.max(0,Math.min(Number(dt)||0,.05));
    for (let i=fxParticles.length-1;i>=0;i--) {
      const p=fxParticles[i]; p.life-=step;
      if (p.life<=0) { fxParticles.splice(i,1); continue; }
      p.vy+=(p.gravity||0)*step; p.x+=(p.vx||0)*step; p.y+=(p.vy||0)*step;
    }
    for (let i=fxRings.length-1;i>=0;i--) {
      fxRings[i].life-=step; if (fxRings[i].life<=0) fxRings.splice(i,1);
    }
    for (let i=fxSprites.length-1;i>=0;i--) {
      fxSprites[i].elapsed+=step; if (fxSprites[i].elapsed>=fxSprites[i].duration) fxSprites.splice(i,1);
    }
    for (let i=fxCoinPops.length-1;i>=0;i--) {
      fxCoinPops[i].elapsed+=step; if (fxCoinPops[i].elapsed>=fxCoinPops[i].duration) fxCoinPops.splice(i,1);
    }
  }

  function drawFxSpritesOverlay() {
    for (const fx of fxSprites) {
      const eff=fx.effect, ratio=Math.min(.9999,fx.elapsed/fx.duration);
      ctx.save();
      ctx.translate(fx.x+(fx.flipX?eff.w:0),fx.y+(fx.flipY?eff.h:0));
      ctx.scale(fx.flipX?-1:1,fx.flipY?-1:1);
      if (eff.sheet) {
        if (eff.sheet.complete&&eff.sheet.naturalWidth) {
          const idx=Math.floor(ratio*eff.cols);
          ctx.drawImage(eff.sheet,idx*eff.w,0,eff.w,eff.h,0,0,eff.w,eff.h);
        }
      } else {
        const idx=Math.floor(ratio*eff.frames.length), im=eff.frames[idx];
        if (im&&im.complete&&im.naturalWidth) ctx.drawImage(im,0,0,eff.w,eff.h);
      }
      ctx.restore();
    }
  }

  function drawWorldFxOverlay() {
    for (const p of fxParticles) {
      const alpha=Math.max(0,Math.min(1,p.life/p.maxLife));
      ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=p.color||'#fff'; ctx.strokeStyle=p.color||'#fff';
      if (p.type==='spark') {
        const r=(p.size||5)*alpha;
        ctx.fillRect(Math.round(p.x-r/2),Math.round(p.y-1),Math.round(r),2);
        ctx.fillRect(Math.round(p.x-1),Math.round(p.y-r/2),2,Math.round(r));
      } else {
        const size=Math.max(1,Math.round((p.size||3)*(.55+.45*alpha)));
        ctx.fillRect(Math.round(p.x-size/2),Math.round(p.y-size/2),size,size);
      }
      ctx.restore();
    }
    for (const r of fxRings) {
      const t=1-r.life/r.maxLife, radius=fxLerp(r.startRadius,r.endRadius,t), alpha=Math.max(0,1-t);
      ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=r.color; ctx.lineWidth=r.lineWidth||2; ctx.beginPath();
      const pts=[]; for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4;pts.push([Math.round(r.x+Math.cos(a)*radius),Math.round(r.y+Math.sin(a)*radius)]);}
      ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); ctx.stroke(); ctx.restore();
    }
    for (const pop of fxCoinPops) {
      if (!coinImg.complete||!coinImg.naturalWidth) continue;
      const t=Math.max(0,Math.min(1,pop.elapsed/pop.duration));
      const popScale=1+.3*Math.sin(Math.PI*t), size=20*popScale, cx=pop.x+10, cy=pop.y+10-12*t;
      ctx.save(); ctx.globalAlpha=1-t*.75; ctx.drawImage(coinImg,cx-size/2,cy-size/2,size,size); ctx.restore();
    }
  }

  const overlaySpriteFxCanvas=document.createElement('canvas');
  overlaySpriteFxCanvas.width=64; overlaySpriteFxCanvas.height=64;
  const overlaySpriteFxCtx=overlaySpriteFxCanvas.getContext('2d');
  function drawOverlaySpriteFrame(image,frameIndex,frameRow,x,y,opts={}) {
    const fw=64,fh=64, sxScale=opts.scaleX??1, syScale=opts.scaleY??1;
    let source=image,srcX=(frameIndex||0)*fw,srcY=(frameRow||0)*fh;
    if (opts.whiteFlash) {
      overlaySpriteFxCtx.setTransform(1,0,0,1,0,0); overlaySpriteFxCtx.clearRect(0,0,fw,fh);
      overlaySpriteFxCtx.globalCompositeOperation='source-over'; overlaySpriteFxCtx.globalAlpha=1;
      overlaySpriteFxCtx.drawImage(image,srcX,srcY,fw,fh,0,0,fw,fh);
      overlaySpriteFxCtx.globalCompositeOperation='source-atop'; overlaySpriteFxCtx.fillStyle='#fff'; overlaySpriteFxCtx.fillRect(0,0,fw,fh);
      overlaySpriteFxCtx.globalCompositeOperation='source-over'; source=overlaySpriteFxCanvas; srcX=0; srcY=0;
    }
    ctx.save(); ctx.translate(x+fw/2,y+fh/2); ctx.scale(sxScale,syScale);
    ctx.drawImage(source,srcX,srcY,fw,fh,-fw/2,-fh/2,fw,fh); ctx.restore();
  }
  function overlaySpriteScale(p,now=now0()) {
    if (now<(p.hitSquashUntil||0)) return {x:.72,y:1.18};
    const landAge=now-(p.landingSquashStartedAt||0);
    if (p.landingSquashStartedAt&&landAge>=0&&landAge<180) {
      if (landAge<80){const t=landAge/80;return{x:fxLerp(1.15,.95,t),y:fxLerp(.85,1.05,t)};}
      const t=(landAge-80)/100;return{x:fxLerp(.95,1,t),y:fxLerp(1.05,1,t)};
    }
    const jumpAge=now-(p.jumpStretchStartedAt||0);
    if (p.jumpStretchStartedAt&&jumpAge>=0&&jumpAge<80){const t=jumpAge/80;return{x:fxLerp(.9,1,t),y:fxLerp(1.1,1,t)};}
    return{x:1,y:1};
  }


  let coin = null;
  socket.on("coin", data => {
    coin = data;
    console.log("Coin received:", data.x, data.y);
  });

  socket.on("coin_taken", (data) => {
    coin = null;
    console.log("coin taken:");
  });
  

  // Collision/crate rectangles. Seeded with the built-in level as a fallback,
  // then replaced by scene.json in loadScene() below. `let` so that can swap.
  let boxes = [
    {x: 0, y: 400, width: 20, height: 20},
    {x: 80, y: 450, width: 20, height: 20},
    {x: 100, y: 450, width: 20, height: 20},
    {x: 120, y: 450, width: 20, height: 20},
    {x: 90, y: 350, width: 20, height: 20},
    {x: 110, y: 350, width: 20, height: 20},
    {x: 200, y: 400, width: 20, height: 20},
    {x: 300, y: 480, width: 20, height: 20},
    {x: 420, y: 420, width: 20, height: 20},
    {x: 440, y: 420, width: 20, height: 20},
    {x: 550, y: 380, width: 20, height: 20},
    {x: 620, y: 340, width: 20, height: 20},
    {x: 645, y: 360, width: 20, height: 20},
    {x: 670, y: 340, width: 20, height: 20},
    {x: 750, y: 380, width: 20, height: 20},
    {x: 770, y: 380, width: 20, height: 20},
    {x: 790, y: 380, width: 20, height: 20},
    {x: 750, y: 440, width: 20, height: 20},
    {x: 770, y: 440, width: 20, height: 20},
    {x: 790, y: 440, width: 20, height: 20},


    {x: 860, y: 400, width: 20, height: 20},
    {x: 860, y: 380, width: 20, height: 20},
    
    {x: 980, y: 380, width: 20, height: 20},

    // ---- Extended world: second screen (1000-2000) ----
    {x: 1060, y: 440, width: 20, height: 20},
    {x: 1080, y: 440, width: 20, height: 20},
    {x: 1160, y: 400, width: 20, height: 20},
    {x: 1240, y: 360, width: 20, height: 20},
    {x: 1260, y: 360, width: 20, height: 20},
    {x: 1350, y: 440, width: 20, height: 20},
    {x: 1370, y: 440, width: 20, height: 20},
    {x: 1390, y: 440, width: 20, height: 20},
    {x: 1380, y: 340, width: 20, height: 20},
    {x: 1400, y: 340, width: 20, height: 20},
    {x: 1500, y: 400, width: 20, height: 20},
    {x: 1520, y: 400, width: 20, height: 20},
    {x: 1600, y: 340, width: 20, height: 20},
    {x: 1660, y: 380, width: 20, height: 20},
    {x: 1680, y: 380, width: 20, height: 20},
    {x: 1780, y: 460, width: 20, height: 20},
    {x: 1780, y: 440, width: 20, height: 20},
    {x: 1780, y: 420, width: 20, height: 20},
    {x: 1860, y: 400, width: 20, height: 20},
    {x: 1880, y: 400, width: 20, height: 20},
    {x: 1960, y: 360, width: 20, height: 20},

    // ---- Extended world: third screen (2000-3000) ----
    {x: 2040, y: 440, width: 20, height: 20},
    {x: 2060, y: 440, width: 20, height: 20},
    {x: 2140, y: 400, width: 20, height: 20},
    {x: 2220, y: 360, width: 20, height: 20},
    {x: 2240, y: 360, width: 20, height: 20},
    {x: 2320, y: 420, width: 20, height: 20},
    {x: 2400, y: 460, width: 20, height: 20},
    {x: 2420, y: 460, width: 20, height: 20},
    {x: 2440, y: 460, width: 20, height: 20},
    {x: 2420, y: 440, width: 20, height: 20},
    {x: 2540, y: 400, width: 20, height: 20},
    {x: 2620, y: 360, width: 20, height: 20},
    {x: 2640, y: 360, width: 20, height: 20},
    {x: 2720, y: 420, width: 20, height: 20},
    {x: 2740, y: 420, width: 20, height: 20},
    {x: 2840, y: 380, width: 20, height: 20},
    {x: 2900, y: 440, width: 20, height: 20},
    {x: 2920, y: 440, width: 20, height: 20},
    {x: 2980, y: 400, width: 20, height: 20},
  ];

  // Same fixed "world" the viewer.html physics/box layout use — now 3000
  // wide (three screens). Unlike viewer.html, the overlay has NO camera:
  // it always shows the ENTIRE world at once by scaling world coordinates
  // down to fit the canvas width. Vertical stays fixed; the same uniform
  // factor is applied to Y so sprites keep their proportions instead of
  // getting squashed.
  let WORLD_WIDTH = 3000;
  let WORLD_HEIGHT = 500;
  let GROUND_GRASS_HEIGHT = 14;
  let GROUND_TILE_WIDTH = 40;

  // 1920 / 3000 = 0.64 — every world unit is 0.64 overlay pixels. Recomputed
  // in loadScene() if the scene's world width differs from the default.
  let WORLD_SCALE = canvas.width / WORLD_WIDTH;

  // ---- Scene props (decorations, no collision) ----
  let props = [];
  const propImages = {};
  function getPropImage(src) {
    if (!propImages[src]) {
      const im = new Image();
      im.src = src;
      propImages[src] = im;
    }
    return propImages[src];
  }

  // Load the level from scene.json — the same file viewer.html and the server
  // read. On any failure we keep the built-in fallback level so the overlay is
  // never blank on stream.
  async function loadScene() {
    try {
      const res = await fetch('/scene.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const scene = await res.json();
      if (scene.world && Number.isFinite(scene.world.width) && Number.isFinite(scene.world.height)) {
        WORLD_WIDTH = scene.world.width;
        WORLD_HEIGHT = scene.world.height;
        WORLD_SCALE = canvas.width / WORLD_WIDTH;
      }
      if (Array.isArray(scene.hitboxes)) {
        boxes = scene.hitboxes
          .filter(b => b && Number.isFinite(b.x) && Number.isFinite(b.y))
          .map(b => ({ x: +b.x, y: +b.y, width: +b.width || 20, height: +b.height || 20 }));
      }
      if (Array.isArray(scene.props)) {
        props = scene.props
          .filter(p => p && p.src && Number.isFinite(p.x) && Number.isFinite(p.y))
          .map(p => ({ src: p.src, x: +p.x, y: +p.y, width: +p.width || 32, height: +p.height || 32 }));
      }
      if (scene.ground) {
        if (Number.isFinite(scene.ground.height)) GROUND_GRASS_HEIGHT = scene.ground.height;
        if (Number.isFinite(scene.ground.tileWidth)) GROUND_TILE_WIDTH = scene.ground.tileWidth;
        if (scene.ground.sprite) grassImg.src = scene.ground.sprite;
      }
    } catch (e) {
      console.warn('Could not load scene.json — using built-in fallback level:', e);
    }
  }
  loadScene();

// Push the rendered world down so jumping players/chat do not get cut off at the top.
const WORLD_OFFSET_Y = 100;

  // Players only send a position update ~30x/sec (see viewer.html's move
  // throttle), but this canvas redraws ~60x/sec. Snapping straight to each
  // new position on arrival is what caused the stutter/teleport look.
  // Instead we ease the drawn position toward the latest known target every
  // frame, scaled by actual elapsed time so it looks the same regardless of
  // OBS's frame rate.
  const OTHER_PLAYER_SMOOTHING_TAU = 0.08; // seconds — lower = snappier, higher = smoother
  let lastFrameTime = performance.now();

  function updatePlayerInterpolation(deltaTime) {
    const factor = 1 - Math.exp(-deltaTime / OTHER_PLAYER_SMOOTHING_TAU);
    for (const id in players) {
      const p = players[id];
      p.renderX += (p.x - p.renderX) * factor;
      p.renderY += (p.y - p.renderY) * factor;
    }
  }

  // The sprite's walk/idle cycle used to just play whatever frameIndex the
  // player's own browser tab last reported. When that tab is backgrounded
  // (viewer switches away, minimizes, etc.), browsers throttle its
  // requestAnimationFrame loop way down, so it stops sending fresh frames —
  // and the overlay, which keeps redrawing at full rate, just kept painting
  // that one stale frame forever, looking frozen.
  //
  // Fix: animate every player's sprite locally on a free-running timer here,
  // independent of the network. We only take "emote" (idle/run) and
  // "frameRow" (facing direction) from the network, and fall back to idle if
  // we haven't heard from them in a while (covers the edge case of someone
  // backgrounding their tab mid-run — otherwise they'd run in place forever).
  const FRAME_INTERVAL = 0.1; // seconds per animation frame, matches viewer.html
  const STALE_MS = 600; // no update in this long -> treat as idle

  function updatePlayerAnimation(p, deltaTime) {
    const stale = (performance.now() - (p.lastUpdateAt || 0)) > STALE_MS;
    const emote = stale ? 'idle' : (p.emote || 'idle');
    const frameCount = emote === 'run' ? 8 : 6;
    const frameRow = emote === 'run' ? (p.frameRow ?? 3) : 0;

    const visuallyFrozen = now0() < (p.hitStopUntil || 0);
    if (!visuallyFrozen) {
      p.localFrameTimer = (p.localFrameTimer || 0) + deltaTime;
      if (p.localFrameTimer >= FRAME_INTERVAL) {
        p.localFrameTimer -= FRAME_INTERVAL;
        p.localFrameIndex = ((p.localFrameIndex || 0) + 1) % frameCount;
      }
    }
    if (!(p.localFrameIndex < frameCount)) p.localFrameIndex = 0; // guard if frameCount just shrank

    return { emote, frameRow, frameIndex: p.localFrameIndex };
  }

  // ---- Bat swing rendering -------------------------------------------------
  // Identical animation math to viewer.html: the bat pivots around the
  // character's center (the grip), sweeping from low-forward to up-forward
  // with an ease-out, mirrored for left-facing swings. Drawn in WORLD space
  // (inside the scaled transform), so it shrinks with the sprites exactly
  // like everything else on the overlay.
  const BAT_DRAW_W = 9;
  const BAT_DRAW_H = 26;
  const SWING_START_ANGLE = 2.4;   // radians clockwise from straight-up (~137deg, low)
  const SWING_END_ANGLE = -0.35;   // slightly past vertical (~-20deg, high)

  function drawBatSwing(context, cx, cy, dir, progress) {
    if (!batImg.complete || !batImg.naturalWidth) return; // image not loaded yet
    const t = Math.min(Math.max(progress, 0), 1);
    // Ease-out so the swipe starts fast and finishes soft, like a real swing.
    const eased = 1 - (1 - t) * (1 - t);
    const angle = SWING_START_ANGLE + (SWING_END_ANGLE - SWING_START_ANGLE) * eased;
    context.save();
    context.translate(cx, cy);
    context.scale(dir, 1);
    context.rotate(angle);
    // Grip at the pivot, barrel extending "up" in local space.
    context.drawImage(batImg, -BAT_DRAW_W / 2, -BAT_DRAW_H, BAT_DRAW_W, BAT_DRAW_H);
    context.restore();
  }

  function draw(currentTime) {
    const now = currentTime || performance.now();
    const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.25); // clamp huge gaps (e.g. tab was backgrounded)
    lastFrameTime = now;

    updatePlayerInterpolation(deltaTime);
    updateSharedFx(deltaTime);
    setObjects(); // leaves the world-scale transform active
    // Dash smoke, double-jump ring, landing dust and invisibility shimmer sit
    // behind sprites just like they do in viewer.html.
    drawFxSpritesOverlay();

    // ---- Pass 1: sprites, in scaled WORLD space ----
    let high_score = -1;
    let high_user = "";
    for (const id in players) {
      const p = players[id];
      // Guard against any malformed/incomplete entry (e.g. a stale server
      // version, or a mid-join race) ever hijacking the leaderboard display
      // with a blank name or bogus score.
      const validScore = typeof p.score === 'number' && Number.isFinite(p.score);
      const validName = typeof p.username === 'string' && p.username.length > 0;
      if (validScore && validName && p.score >= high_score) {
        high_score = p.score;
        high_user = p.username;
      }
      if (p.invisible) continue; // invisible players are hidden on the overlay too
      const fw = 64, fh = 64;
      const anim = updatePlayerAnimation(p, deltaTime);
      const img = skinSheet(p.skin, anim.emote);
      const spriteScale = overlaySpriteScale(p, now0());
      drawOverlaySpriteFrame(
        img, anim.frameIndex, anim.frameRow,
        p.renderX - 20, p.renderY - 20,
        { whiteFlash: now0() < (p.hitFlashUntil || 0), scaleX: spriteScale.x, scaleY: spriteScale.y }
      );
    }

    // Bat swings go over the sprites (the bat passes in front of the
    // character), still in the same scaled world space. Each swing plays
    // for SWING_DURATION_MS from when its event arrived.
    const swingNowMs = performance.now();
    for (const id in players) {
      const p = players[id];
      if (p.invisible) continue;
      if (p.swingStartAt && swingNowMs - p.swingStartAt < SWING_DURATION_MS) {
        drawBatSwing(
          ctx,
          p.renderX + 10, // sprite center (matches the name-label offset)
          p.renderY + 10,
          p.swingDir || 1,
          (swingNowMs - p.swingStartAt) / SWING_DURATION_MS
        );
      }
    }

    // Impact particles, max-tier shockwaves and coin pops sit over sprites
    // and weapons, but still in stable world space (no stream camera shake).
    drawWorldFxOverlay();

    // ---- Pass 2: text, in SCREEN space ----
    // Names and chat bubbles are drawn at scaled positions but full pixel
    // size — at WORLD_SCALE (0.64) a world-space 16px name would be ~10px
    // and bubble text ~5px, unreadable on stream.
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    for (const id in players) {
      const p = players[id];
      if (p.invisible) continue;
      ctx.font = '16px Arial';
      ctx.fillStyle = p.color || 'blue';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(p.username || '', (p.renderX + 10) * WORLD_SCALE, WORLD_OFFSET_Y + (p.renderY - 5) * WORLD_SCALE);
    }

    // Chat bubbles on top of every sprite/name, so they're never hidden
    // behind another player who happens to be standing in front.
    const nowMs = performance.now();
    for (const id in players) {
      const p = players[id];
      if (p.invisible) continue;
      if (p.chatMessage && nowMs < p.chatExpiresAt) {
        drawChatBubble(ctx, p.chatMessage, (p.renderX + 10) * WORLD_SCALE, WORLD_OFFSET_Y + (p.renderY - 22) * WORLD_SCALE);
      }
    }

    requestAnimationFrame(draw);
    if (high_user) {
      // Centered under the scaled world (which is WORLD_HEIGHT*WORLD_SCALE
      // pixels tall), instead of the old hardcoded spot tuned for the
      // unscaled 1000x500 layout.
      ctx.font = 'bold 20px Arial';
      ctx.fillStyle = 'white';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'black';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const hsX = canvas.width / 2;
      const hsY = WORLD_OFFSET_Y + WORLD_HEIGHT * WORLD_SCALE + 0;
      ctx.strokeText("High Score: " + high_user + " -- " + high_score, hsX, hsY);
      ctx.fillText("High Score: " + high_user + " -- " + high_score, hsX, hsY);
    }
  }

  function setObjects() {
    // Clear in raw pixel space, then switch into scaled world space so the
    // ENTIRE 3000-wide world maps onto the canvas — no cameraX here, the
    // overlay always shows everything.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(WORLD_SCALE, 0, 0, WORLD_SCALE, 0, WORLD_OFFSET_Y);

    for (let x = 0; x < WORLD_WIDTH; x += GROUND_TILE_WIDTH) {
      ctx.drawImage(grassImg, x, WORLD_HEIGHT - GROUND_GRASS_HEIGHT, GROUND_TILE_WIDTH, GROUND_GRASS_HEIGHT);
    }
    // Only decorations (props) are drawn. Hitboxes are invisible collision.
    for (const p of props) {
      const im = getPropImage(p.src);
      if (im.complete && im.naturalWidth) {
        ctx.drawImage(im, p.x, p.y, p.width, p.height);
      }
    }
    if (coin != null) {
        ctx.drawImage(coinImg, coin.x, coin.y, 20, 20);
      }
  }

  requestAnimationFrame(draw);
</script>
